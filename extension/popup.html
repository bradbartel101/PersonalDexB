<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 330px; margin: 0; padding: 14px;
    font: 14px/1.45 system-ui, sans-serif; color: #1F2B26; background: #F6F4EF;
  }
  h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 7px; }
  h1 svg { color: #2E6B57; }
  .sub { font-size: 12px; color: #66746D; margin: 0 0 12px; }
  .row {
    display: flex; align-items: center; gap: 9px; padding: 7px 9px;
    background: #fff; border: 1px solid #E7E3D8; border-radius: 10px; margin-bottom: 6px;
  }
  .row img, .row .ph {
    width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
    background: #E3EDE7; color: #33604F; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700;
  }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { display: block; font-size: 11.5px; color: #66746D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rm { border: none; background: none; color: #98A49E; cursor: pointer; font-size: 15px; padding: 2px 5px; }
  .rm:hover { color: #A64B2A; }
  .actions { display: flex; gap: 7px; margin-top: 11px; }
  button.act {
    flex: 1; border: 1px solid #E7E3D8; background: #fff; border-radius: 9px;
    padding: 8px 6px; font: 600 12.5px system-ui, sans-serif; cursor: pointer; color: #1F2B26;
  }
  button.act.primary { background: #2E6B57; border-color: #2E6B57; color: #fff; }
  button.act:hover { filter: brightness(0.97); }
  .empty { padding: 18px 8px; text-align: center; color: #66746D; font-size: 12.5px; }
  .note { font-size: 11px; color: #98A49E; margin: 10px 0 0; }
  #status { font-size: 11.5px; color: #2E6B57; height: 14px; margin-top: 7px; text-align: center; }
</style>
</head>
<body>
  <h1>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="9.5" cy="12" r="6"/><circle cx="15.5" cy="12" r="6" opacity=".45"/>
    </svg>
    Hearth capture
  </h1>
  <p class="sub">Profiles you saved while browsing LinkedIn.</p>
  <div id="list"></div>
  <div class="actions">
    <button class="act primary" id="copy">Copy JSON</button>
    <button class="act" id="download">Download</button>
    <button class="act" id="clear">Clear</button>
  </div>
  <div id="status"></div>
  <p class="note">In Hearth: LinkedIn / CSV import → paste the JSON (or pick the downloaded file). Captures are removed here after you clear them.</p>
  <script src="popup.js"></script>
</body>
</html>
