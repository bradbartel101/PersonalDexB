  --av7-bg: #E5E9F2; --av7-fg: #44557E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131B17;
    --card: #1B2520;
    --card-2: #202B26;
    --ink: #E8EDE9;
    --muted: #93A29A;
    --faint: #6C7B74;
    --line: #2A362F;
    --line-soft: #24302A;
    --accent: #6FBEA0;
    --accent-hover: #82CBAF;
    --accent-ink: #0F211A;
    --accent-soft: rgba(111, 190, 160, 0.14);
    --accent-soft-2: rgba(111, 190, 160, 0.08);
    --overdue: #DE8A64;
    --overdue-soft: rgba(222, 138, 100, 0.14);
    --soon: #CFA84F;
    --soon-soft: rgba(207, 168, 79, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-lift: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
    --av0-bg: #23392F; --av0-fg: #93C6AE;
    --av1-bg: #2D2839; --av1-fg: #B3A4D6;
    --av2-bg: #383024; --av2-fg: #D3B084;
    --av3-bg: #223339; --av3-fg: #8FBECD;
    --av4-bg: #3A2A2A; --av4-fg: #D39C9C;
    --av5-bg: #2E3324; --av5-fg: #B3BE85;
    --av6-bg: #342A38; --av6-fg: #C79BC9;
    --av7-bg: #272E3D; --av7-fg: #98AAD5;
  }
}
:root[data-theme="light"] {
  --bg: #F6F4EF; --card: #FFFFFF; --card-2: #FBFAF7; --ink: #1F2B26; --muted: #66746D;
  --faint: #98A49E; --line: #E7E3D8; --line-soft: #EFECE3;
  --accent: #2E6B57; --accent-hover: #275C4B; --accent-ink: #FFFFFF;
  --accent-soft: #E7F0EB; --accent-soft-2: #F0F5F2;
  --overdue: #A64B2A; --overdue-soft: #F6E9E2; --soon: #8F6D1E; --soon-soft: #F4EDDB;
  --shadow: 0 1px 2px rgba(31, 43, 38, 0.04), 0 10px 28px -14px rgba(31, 43, 38, 0.14);
  --shadow-lift: 0 2px 4px rgba(31, 43, 38, 0.05), 0 16px 40px -16px rgba(31, 43, 38, 0.20);
  --av0-bg: #E3EDE7; --av0-fg: #33604F; --av1-bg: #EAE6F0; --av1-fg: #574B72;
  --av2-bg: #F0E7DC; --av2-fg: #7A5A34; --av3-bg: #E0EBEF; --av3-fg: #3A5F6E;
  --av4-bg: #F0E3E3; --av4-fg: #7A4646; --av5-bg: #E8EDD9; --av5-fg: #5A6636;
  --av6-bg: #ECE5EF; --av6-fg: #6D4A6E; --av7-bg: #E5E9F2; --av7-fg: #44557E;
}
:root[data-theme="dark"] {
  --bg: #131B17; --card: #1B2520; --card-2: #202B26; --ink: #E8EDE9; --muted: #93A29A;
  --faint: #6C7B74; --line: #2A362F; --line-soft: #24302A;
  --accent: #6FBEA0; --accent-hover: #82CBAF; --accent-ink: #0F211A;
  --accent-soft: rgba(111, 190, 160, 0.14); --accent-soft-2: rgba(111, 190, 160, 0.08);
  --overdue: #DE8A64; --overdue-soft: rgba(222, 138, 100, 0.14);
  --soon: #CFA84F; --soon-soft: rgba(207, 168, 79, 0.13);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.25); --shadow-lift: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
  --av0-bg: #23392F; --av0-fg: #93C6AE; --av1-bg: #2D2839; --av1-fg: #B3A4D6;
  --av2-bg: #383024; --av2-fg: #D3B084; --av3-bg: #223339; --av3-fg: #8FBECD;
  --av4-bg: #3A2A2A; --av4-fg: #D39C9C; --av5-bg: #2E3324; --av5-fg: #B3BE85;
  --av6-bg: #342A38; --av6-fg: #C79BC9; --av7-bg: #272E3D; --av7-fg: #98AAD5;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
input::placeholder, textarea::placeholder { color: var(--faint); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.display { font-family: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; }

/* ---------- shell ---------- */
.app { display: flex; min-height: 100vh; }

.rail {
  width: 224px;
  flex: 0 0 224px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 26px 18px 20px;
  border-right: 1px solid var(--line);
}
.wordmark {
  display: flex; align-items: center; gap: 9px;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 21px; font-weight: 700; letter-spacing: -0.01em;
  padding: 0 8px;
}
.wordmark svg { color: var(--accent); flex: 0 0 auto; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  color: var(--muted); font-weight: 500;
  transition: background 0.12s, color 0.12s;
}
.nav-btn:hover { background: var(--accent-soft-2); color: var(--ink); }
.nav-btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-badge {
  margin-left: auto; min-width: 20px; text-align: center;
  font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 99px;
  background: var(--overdue-soft); color: var(--overdue);
  font-variant-numeric: tabular-nums;
}
.nav-badge.quiet { background: var(--line-soft); color: var(--muted); }

.rail-spacer { flex: 1; }

.rail-stats {
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card-2);
}
.rail-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rail-stat b {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.rail-stat span { font-size: 12px; color: var(--muted); }
.rail-stat .hot { color: var(--overdue); }

.rail-tools { display: flex; flex-direction: column; gap: 1px; }
.rail-tool {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 10px; border-radius: 8px;
  font-size: 13px; color: var(--muted); text-align: left;
}
.rail-tool:hover { background: var(--accent-soft-2); color: var(--ink); }
.rail-hint { padding: 4px 10px 0; font-size: 11.5px; color: var(--faint); line-height: 1.7; }
.rail-hint kbd {
  font-family: inherit; font-size: 10.5px; border: 1px solid var(--line);
  border-radius: 4px; padding: 0 4px; margin: 0 1px; background: var(--card);
}

main { flex: 1 1 auto; min-width: 0; }
.page { max-width: 860px; margin: 0 auto; padding: 44px 36px 100px; }

/* ---------- page headers ---------- */
.page-head { margin-bottom: 26px; }
.page-date {
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.page-title {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 32px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15;
  margin: 0; text-wrap: balance;
}
.page-sub { color: var(--muted); margin: 8px 0 0; }

.section { margin-top: 34px; }
.section-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px;
}
.section-title {
  font-size: 12.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
.section-count { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* ---------- cards & rows ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: var(--shadow);
}
.row-list > * { border-bottom: 1px solid var(--line-soft); }
.row-list > *:last-child { border-bottom: none; }

.person-row { padding: 0; }
.person-row-main {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
}
.person-row-info { flex: 1; min-width: 0; }
.person-name {
  font-weight: 600; font-size: 15px; letter-spacing: -0.005em;
  background: none; border: none; padding: 0; text-align: left; cursor: pointer;
}
.person-name:hover { color: var(--accent); }
.person-meta {
  font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.person-side { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

/* ---------- avatar ---------- */
.avatar {
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 600; flex: 0 0 auto; overflow: hidden; user-select: none;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av-0 { background: var(--av0-bg); color: var(--av0-fg); }
.av-1 { background: var(--av1-bg); color: var(--av1-fg); }
.av-2 { background: var(--av2-bg); color: var(--av2-fg); }
.av-3 { background: var(--av3-bg); color: var(--av3-fg); }
.av-4 { background: var(--av4-bg); color: var(--av4-fg); }
.av-5 { background: var(--av5-bg); color: var(--av5-fg); }
.av-6 { background: var(--av6-bg); color: var(--av6-fg); }
.av-7 { background: var(--av7-bg); color: var(--av7-fg); }

/* ---------- pills & chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.pill.overdue { background: var(--overdue-soft); color: var(--overdue); }
.pill.soon { background: var(--soon-soft); color: var(--soon); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.none { background: var(--line-soft); color: var(--faint); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px;
  background: var(--line-soft); color: var(--muted); white-space: nowrap;
}
button.chip { cursor: pointer; transition: background 0.12s, color 0.12s; }
button.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip .x { opacity: 0.55; display: inline-flex; }
.chip .x:hover { opacity: 1; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 7px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--faint); background: var(--card-2); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--accent-soft-2); color: var(--ink); border-color: transparent; }
.btn.danger { color: var(--overdue); }
.btn.danger:hover { background: var(--overdue-soft); border-color: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px; color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.icon-btn:hover { background: var(--accent-soft-2); color: var(--ink); }
.icon-btn.on { background: var(--accent-soft); color: var(--accent); }

/* ---------- quick log ---------- */
.quicklog {
  padding: 12px 18px 16px 72px; background: var(--card-2);
  display: flex; flex-direction: column; gap: 10px;
  animation: slide-in 0.16s ease-out;
}
@keyframes slide-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.type-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.type-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 500;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  transition: all 0.12s;
}
.type-chip:hover { border-color: var(--accent); color: var(--accent); }
.type-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.quicklog-row { display: flex; gap: 8px; align-items: center; }
.quicklog input[type="text"] {
  flex: 1; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 7px 12px; font-size: 14px;
}
.quicklog input[type="text"]:focus { outline: none; border-color: var(--accent); }
.quicklog input[type="date"] {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 6px 10px; font-size: 13px; color: var(--muted);
}

/* ---------- upcoming ---------- */
.up-row { display: flex; align-items: center; gap: 13px; padding: 13px 18px; }
.up-icon {
  width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent);
}
.up-icon.bell { background: var(--soon-soft); color: var(--soon); }
.up-body { flex: 1; min-width: 0; }
.up-title { font-weight: 600; font-size: 14px; }
.up-title button { font-weight: 600; }
.up-title button:hover { color: var(--accent); }
.up-sub { font-size: 12.5px; color: var(--muted); }
.up-when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- empty states ---------- */
.empty {
  padding: 40px 24px; text-align: center; color: var(--muted);
}
.empty .display { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.empty p { margin: 0; font-size: 13.5px; }
.empty svg { color: var(--accent); opacity: 0.75; margin-bottom: 10px; }

/* ---------- people toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.searchbox {
  display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 160px;
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 7px 12px; color: var(--faint);
}
.searchbox input { flex: 1; border: none; background: none; padding: 0; min-width: 0; }
.searchbox input:focus { outline: none; }
.searchbox:focus-within { border-color: var(--accent); }
.select {
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  border-radius: 10px; padding: 7px 8px; font-size: 13px; max-width: 130px;
}
.select.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.view-toggle { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.view-toggle .icon-btn { border-radius: 0; width: 34px; }
.view-toggle .icon-btn.on { background: var(--accent-soft); }

.quickadd { margin-bottom: 16px; }
.quickadd form { display: flex; gap: 8px; }
.quickadd input {
  flex: 1; border: 1px dashed var(--line); background: transparent;
  border-radius: 12px; padding: 10px 14px; font-size: 14.5px;
}
.quickadd input:focus { outline: none; border-style: solid; border-color: var(--accent); background: var(--card); }

/* ---------- grid view ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.grid-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 22px 14px 18px; text-align: center; cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
}
.grid-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.grid-card .person-meta { max-width: 100%; }

/* ---------- profile ---------- */
.back-btn {
  display: inline-flex; align-items: center; gap: 5px; color: var(--muted);
  font-size: 13.5px; font-weight: 500; margin-bottom: 18px; border-radius: 6px;
}
.back-btn:hover { color: var(--accent); }

.profile-head { display: flex; gap: 20px; padding: 26px 26px 22px; align-items: flex-start; }
.avatar-upload { position: relative; cursor: pointer; border-radius: 50%; }
.avatar-upload::after {
  content: "photo"; position: absolute; inset: auto 0 0; text-align: center;
  font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: #fff; background: rgba(20, 30, 25, 0.55); padding: 3px 0 5px;
  opacity: 0; transition: opacity 0.12s;
}
.avatar-upload:hover::after { opacity: 1; }
.profile-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.name-input {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 26px; font-weight: 700; letter-spacing: -0.015em;
  border: none; background: transparent; padding: 2px 6px; margin-left: -6px;
  border-radius: 8px; width: 100%;
}
.name-input:hover { background: var(--accent-soft-2); }
.name-input:focus { outline: none; background: var(--accent-soft-2); }
.context-input {
  border: none; background: transparent; color: var(--muted); font-size: 14px;
  padding: 2px 6px; margin-left: -6px; border-radius: 6px; width: 100%;
}
.context-input:hover { background: var(--accent-soft-2); }
.context-input:focus { outline: none; background: var(--accent-soft-2); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-add {
  border: 1px dashed var(--line); background: none; color: var(--faint);
  font-size: 12px; padding: 2px 9px; border-radius: 99px;
}
.chip-add:hover { color: var(--accent); border-color: var(--accent); }
.chip-input {
  border: 1px solid var(--accent); background: var(--card); font-size: 12px;
  padding: 2px 9px; border-radius: 99px; width: 110px;
}
.chip-input:focus { outline: none; }

.profile-actions { display: flex; gap: 8px; padding: 0 26px 22px; flex-wrap: wrap; }

.pcard { margin-top: 18px; padding: 20px 26px 22px; }
.pcard-title {
  font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 14px;
}
.pcard-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.pcard-title-row .pcard-title { margin: 0; }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
.field { display: flex; flex-direction: column; }
.field label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--faint); display: flex; align-items: center; gap: 6px;
}
.field label .icon-btn { width: 18px; height: 18px; opacity: 0; }
.field:hover label .icon-btn { opacity: 1; }
.field input {
  border: none; background: transparent; padding: 3px 6px; margin-left: -6px;
  border-radius: 6px; font-size: 14px;
}
.field input:hover { background: var(--accent-soft-2); }
.field input:focus { outline: none; background: var(--accent-soft-2); }
.add-field { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.cadence-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cadence-status { margin-top: 12px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.days-input { width: 64px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.days-input:focus { outline: none; border-color: var(--accent); }

.notes-area {
  width: 100%; min-height: 110px; resize: vertical; border: none;
  background: var(--card-2); border-radius: 12px; padding: 12px 14px;
  font-size: 14px; line-height: 1.6;
}
.notes-area:focus { outline: 1px solid var(--accent); }

/* timeline */
.tl-composer { display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line-soft); margin-bottom: 6px; }
.tl-entry { display: flex; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.tl-entry:last-child { border-bottom: none; }
.tl-icon {
  width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft-2); color: var(--accent);
}
.tl-body { flex: 1; min-width: 0; }
.tl-head { display: flex; align-items: baseline; gap: 8px; }
.tl-type { font-weight: 600; font-size: 13.5px; }
.tl-date { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tl-text { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; overflow-wrap: break-word; }
.tl-del { opacity: 0; }
.tl-entry:hover .tl-del { opacity: 1; }

/* reminders */
.rem-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.rem-date { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rem-text { flex: 1; font-size: 14px; }
.rem-add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.rem-add input[type="date"] { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.rem-add input[type="text"] { flex: 1; min-width: 140px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
.rem-add input:focus { outline: none; border-color: var(--accent); }

/* ---------- pro: star, bulk, history, merge ---------- */
.icon-btn.star.on { color: var(--soon); }
.icon-btn.star.on svg { fill: currentColor; }
.btn.star-on { color: var(--soon); border-color: var(--soon); }
.btn.star-on svg { fill: currentColor; }
.profile-archived {
  margin: -10px 26px 20px; padding: 8px 14px; border-radius: 10px;
  background: var(--line-soft); color: var(--muted); font-size: 13px;
}
.bulkbar {
  position: sticky; bottom: 16px; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 14px; margin-top: 16px; box-shadow: var(--shadow-lift);
}
.bulk-count { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.bulk-sep { width: 1px; height: 20px; background: var(--line); }
.bulk-input {
  width: 90px; border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; padding: 5px 9px; font-size: 13px;
}
.bulk-input:focus { outline: none; border-color: var(--accent); }
.row-check { width: 16px; height: 16px; accent-color: var(--accent); flex: 0 0 auto; cursor: pointer; }
.hist-type {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 8px;
  font-size: 12px; font-weight: 600; color: var(--accent);
}
.dup-group {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}
.dup-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
.dup-meta { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.field-act { display: inline-flex; color: var(--accent); }
.field-act:hover { color: var(--accent-hover); }

/* ---------- linkedin import ---------- */
.li-channel {
  border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}
.li-channel > b { font-size: 13.5px; }
.li-channel p { margin: 0; }
.li-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.li-actions a.btn { text-decoration: none; }
.li-paste {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  font-size: 12px; font-family: ui-monospace, monospace; background: var(--card-2); resize: vertical;
}
.li-paste:focus { outline: none; border-color: var(--accent); }
.li-options { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.li-review {
  display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto;
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 6px;
}
.li-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 9px;
  border-radius: 9px; cursor: pointer;
}
.li-item:hover { background: var(--accent-soft-2); }
.li-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li-who b { font-size: 13.5px; }
.li-who span {
  font-size: 12px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- toast & banner ---------- */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px;
  font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lift);
  animation: toast-in 0.18s ease-out; z-index: 50; max-width: 90vw;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.banner {
  background: var(--soon-soft); color: var(--soon); border: 1px solid var(--soon);
  border-radius: 12px; padding: 10px 16px; font-size: 13.5px; margin-bottom: 20px;
}

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(15, 22, 18, 0.4); z-index: 40;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lift);
  max-width: 480px; width: 100%; padding: 24px; max-height: 85vh; overflow: auto;
}
.modal h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; margin: 0 0 8px; font-size: 18px; }
.modal p { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
.modal textarea {
  width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; font-size: 12px; font-family: ui-monospace, monospace; background: var(--card-2);
  resize: vertical;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* ---------- responsive ---------- */
@media (max-width: 780px) {
  .app { flex-direction: column; }
  .rail {
    width: 100%; flex: none; height: auto; position: static;
    flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 14px 16px; border-right: none; border-bottom: 1px solid var(--line);
  }
  .nav { flex-direction: row; }
  .rail-spacer { display: none; }
  .rail-stats, .rail-hint { display: none; }
  .rail-tools { flex-direction: row; margin-left: auto; }
  .rail-tool span { display: none; }
  .page { padding: 24px 16px 80px; }
  .fields { grid-template-columns: 1fr; }
  .profile-head { flex-direction: column; align-items: center; text-align: center; }
  .profile-id { width: 100%; align-items: center; }
  .name-input, .context-input { text-align: center; }
  .chip-row { justify-content: center; }
  .profile-actions { justify-content: center; }
  .quicklog { padding-left: 18px; }
  .person-side .btn span.lbl { display: none; }
}
