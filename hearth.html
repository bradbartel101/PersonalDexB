  --av7-bg: #E5E9F2; --av7-fg: #44557E;
  --map-sea: #E8EEF2; --map-land: #DCD8CB; --map-line: #C7C2B2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131B17;
    --card: #1B2520;
    --card-2: #202B26;
    --ink: #E8EDE9;
    --muted: #93A29A;
    --faint: #6C7B74;
    --line: #2A362F;
    --line-soft: #24302A;
    --accent: #6FBEA0;
    --accent-hover: #82CBAF;
    --accent-ink: #0F211A;
    --accent-soft: rgba(111, 190, 160, 0.14);
    --accent-soft-2: rgba(111, 190, 160, 0.08);
    --overdue: #DE8A64;
    --overdue-soft: rgba(222, 138, 100, 0.14);
    --soon: #CFA84F;
    --soon-soft: rgba(207, 168, 79, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-lift: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
    --av0-bg: #23392F; --av0-fg: #93C6AE;
    --av1-bg: #2D2839; --av1-fg: #B3A4D6;
    --av2-bg: #383024; --av2-fg: #D3B084;
    --av3-bg: #223339; --av3-fg: #8FBECD;
    --av4-bg: #3A2A2A; --av4-fg: #D39C9C;
    --av5-bg: #2E3324; --av5-fg: #B3BE85;
    --av6-bg: #342A38; --av6-fg: #C79BC9;
    --av7-bg: #272E3D; --av7-fg: #98AAD5;
    --map-sea: #16211F; --map-land: #2C3A33; --map-line: #3A4A41;
  }
}
:root[data-theme="light"] {
  --bg: #F6F4EF; --card: #FFFFFF; --card-2: #FBFAF7; --ink: #1F2B26; --muted: #66746D;
  --faint: #98A49E; --line: #E7E3D8; --line-soft: #EFECE3;
  --accent: #2E6B57; --accent-hover: #275C4B; --accent-ink: #FFFFFF;
  --accent-soft: #E7F0EB; --accent-soft-2: #F0F5F2;
  --overdue: #A64B2A; --overdue-soft: #F6E9E2; --soon: #8F6D1E; --soon-soft: #F4EDDB;
  --shadow: 0 1px 2px rgba(31, 43, 38, 0.04), 0 10px 28px -14px rgba(31, 43, 38, 0.14);
  --shadow-lift: 0 2px 4px rgba(31, 43, 38, 0.05), 0 16px 40px -16px rgba(31, 43, 38, 0.20);
  --av0-bg: #E3EDE7; --av0-fg: #33604F; --av1-bg: #EAE6F0; --av1-fg: #574B72;
  --av2-bg: #F0E7DC; --av2-fg: #7A5A34; --av3-bg: #E0EBEF; --av3-fg: #3A5F6E;
  --av4-bg: #F0E3E3; --av4-fg: #7A4646; --av5-bg: #E8EDD9; --av5-fg: #5A6636;
  --av6-bg: #ECE5EF; --av6-fg: #6D4A6E; --av7-bg: #E5E9F2; --av7-fg: #44557E;
  --map-sea: #E8EEF2; --map-land: #DCD8CB; --map-line: #C7C2B2;
}
:root[data-theme="dark"] {
  --bg: #131B17; --card: #1B2520; --card-2: #202B26; --ink: #E8EDE9; --muted: #93A29A;
  --faint: #6C7B74; --line: #2A362F; --line-soft: #24302A;
  --accent: #6FBEA0; --accent-hover: #82CBAF; --accent-ink: #0F211A;
  --accent-soft: rgba(111, 190, 160, 0.14); --accent-soft-2: rgba(111, 190, 160, 0.08);
  --overdue: #DE8A64; --overdue-soft: rgba(222, 138, 100, 0.14);
  --soon: #CFA84F; --soon-soft: rgba(207, 168, 79, 0.13);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.25); --shadow-lift: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
  --av0-bg: #23392F; --av0-fg: #93C6AE; --av1-bg: #2D2839; --av1-fg: #B3A4D6;
  --av2-bg: #383024; --av2-fg: #D3B084; --av3-bg: #223339; --av3-fg: #8FBECD;
  --av4-bg: #3A2A2A; --av4-fg: #D39C9C; --av5-bg: #2E3324; --av5-fg: #B3BE85;
  --av6-bg: #342A38; --av6-fg: #C79BC9; --av7-bg: #272E3D; --av7-fg: #98AAD5;
  --map-sea: #16211F; --map-land: #2C3A33; --map-line: #3A4A41;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
input::placeholder, textarea::placeholder { color: var(--faint); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.display { font-family: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; }

/* ---------- shell ---------- */
.app { display: flex; min-height: 100vh; }

.rail {
  width: 224px;
  flex: 0 0 224px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 26px 18px 20px;
  border-right: 1px solid var(--line);
}
.wordmark {
  display: flex; align-items: center; gap: 9px;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 21px; font-weight: 700; letter-spacing: -0.01em;
  padding: 0 8px;
}
.wordmark svg { color: var(--accent); flex: 0 0 auto; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  color: var(--muted); font-weight: 500;
  transition: background 0.12s, color 0.12s;
}
.nav-btn:hover { background: var(--accent-soft-2); color: var(--ink); }
.nav-btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-badge {
  margin-left: auto; min-width: 20px; text-align: center;
  font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 99px;
  background: var(--overdue-soft); color: var(--overdue);
  font-variant-numeric: tabular-nums;
}
.nav-badge.quiet { background: var(--line-soft); color: var(--muted); }

.rail-spacer { flex: 1; }

.rail-stats {
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card-2);
}
.rail-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rail-stat b {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.rail-stat span { font-size: 12px; color: var(--muted); }
.rail-stat .hot { color: var(--overdue); }

.rail-tools { display: flex; flex-direction: column; gap: 1px; }
.rail-tool {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 10px; border-radius: 8px;
  font-size: 13px; color: var(--muted); text-align: left;
}
.rail-tool:hover { background: var(--accent-soft-2); color: var(--ink); }
.rail-hint { padding: 4px 10px 0; font-size: 11.5px; color: var(--faint); line-height: 1.7; }
.rail-hint kbd {
  font-family: inherit; font-size: 10.5px; border: 1px solid var(--line);
  border-radius: 4px; padding: 0 4px; margin: 0 1px; background: var(--card);
}

main { flex: 1 1 auto; min-width: 0; }
.page { max-width: 860px; margin: 0 auto; padding: 44px 36px 100px; }

/* ---------- page headers ---------- */
.page-head { margin-bottom: 26px; }
.page-date {
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.page-title {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 32px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15;
  margin: 0; text-wrap: balance;
}
.page-sub { color: var(--muted); margin: 8px 0 0; }

.section { margin-top: 34px; }
.section-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px;
}
.section-title {
  font-size: 12.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
.section-count { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* ---------- cards & rows ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: var(--shadow);
}
.row-list > * { border-bottom: 1px solid var(--line-soft); }
.row-list > *:last-child { border-bottom: none; }

.person-row { padding: 0; }
.person-row-main {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
}
.person-row-info { flex: 1; min-width: 0; }
.person-name {
  font-weight: 600; font-size: 15px; letter-spacing: -0.005em;
  background: none; border: none; padding: 0; text-align: left; cursor: pointer;
}
.person-name:hover { color: var(--accent); }
.person-meta {
  font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.person-side { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

/* ---------- avatar ---------- */
.avatar {
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 600; flex: 0 0 auto; overflow: hidden; user-select: none;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av-0 { background: var(--av0-bg); color: var(--av0-fg); }
.av-1 { background: var(--av1-bg); color: var(--av1-fg); }
.av-2 { background: var(--av2-bg); color: var(--av2-fg); }
.av-3 { background: var(--av3-bg); color: var(--av3-fg); }
.av-4 { background: var(--av4-bg); color: var(--av4-fg); }
.av-5 { background: var(--av5-bg); color: var(--av5-fg); }
.av-6 { background: var(--av6-bg); color: var(--av6-fg); }
.av-7 { background: var(--av7-bg); color: var(--av7-fg); }

/* ---------- pills & chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.pill.overdue { background: var(--overdue-soft); color: var(--overdue); }
.pill.soon { background: var(--soon-soft); color: var(--soon); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.none { background: var(--line-soft); color: var(--faint); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px;
  background: var(--line-soft); color: var(--muted); white-space: nowrap;
}
button.chip { cursor: pointer; transition: background 0.12s, color 0.12s; }
button.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip .x { opacity: 0.55; display: inline-flex; }
.chip .x:hover { opacity: 1; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 7px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--faint); background: var(--card-2); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--accent-soft-2); color: var(--ink); border-color: transparent; }
.btn.danger { color: var(--overdue); }
.btn.danger:hover { background: var(--overdue-soft); border-color: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px; color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.icon-btn:hover { background: var(--accent-soft-2); color: var(--ink); }
.icon-btn.on { background: var(--accent-soft); color: var(--accent); }

/* ---------- quick log ---------- */
.quicklog {
  padding: 12px 18px 16px 72px; background: var(--card-2);
  display: flex; flex-direction: column; gap: 10px;
  animation: slide-in 0.16s ease-out;
}
@keyframes slide-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.type-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.type-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 500;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  transition: all 0.12s;
}
.type-chip:hover { border-color: var(--accent); color: var(--accent); }
.type-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.quicklog-row { display: flex; gap: 8px; align-items: center; }
.quicklog input[type="text"] {
  flex: 1; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 7px 12px; font-size: 14px;
}
.quicklog input[type="text"]:focus { outline: none; border-color: var(--accent); }
.quicklog input[type="date"] {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 6px 10px; font-size: 13px; color: var(--muted);
}

/* ---------- upcoming ---------- */
.up-row { display: flex; align-items: center; gap: 13px; padding: 13px 18px; }
.up-icon {
  width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent);
}
.up-icon.bell { background: var(--soon-soft); color: var(--soon); }
.up-body { flex: 1; min-width: 0; }
.up-title { font-weight: 600; font-size: 14px; }
.up-title button { font-weight: 600; }
.up-title button:hover { color: var(--accent); }
.up-sub { font-size: 12.5px; color: var(--muted); }
.up-when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- empty states ---------- */
.empty {
  padding: 40px 24px; text-align: center; color: var(--muted);
}
.empty .display { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.empty p { margin: 0; font-size: 13.5px; }
.empty svg { color: var(--accent); opacity: 0.75; margin-bottom: 10px; }

/* ---------- people toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.searchbox {
  display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 160px;
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 7px 12px; color: var(--faint);
}
.searchbox input { flex: 1; border: none; background: none; padding: 0; min-width: 0; }
.searchbox input:focus { outline: none; }
.searchbox:focus-within { border-color: var(--accent); }
.select {
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  border-radius: 10px; padding: 7px 8px; font-size: 13px; max-width: 130px;
}
.select.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.view-toggle { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.view-toggle .icon-btn { border-radius: 0; width: 34px; }
.view-toggle .icon-btn.on { background: var(--accent-soft); }

.quickadd { margin-bottom: 16px; }
.quickadd form { display: flex; gap: 8px; }
.quickadd input {
  flex: 1; border: 1px dashed var(--line); background: transparent;
  border-radius: 12px; padding: 10px 14px; font-size: 14.5px;
}
.quickadd input:focus { outline: none; border-style: solid; border-color: var(--accent); background: var(--card); }

/* ---------- grid view ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.grid-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 22px 14px 18px; text-align: center; cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
}
.grid-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.grid-card .person-meta { max-width: 100%; }

/* ---------- profile ---------- */
.back-btn {
  display: inline-flex; align-items: center; gap: 5px; color: var(--muted);
  font-size: 13.5px; font-weight: 500; margin-bottom: 18px; border-radius: 6px;
}
.back-btn:hover { color: var(--accent); }

.profile-head { display: flex; gap: 20px; padding: 26px 26px 22px; align-items: flex-start; }
.avatar-upload { position: relative; cursor: pointer; border-radius: 50%; }
.avatar-upload::after {
  content: "photo"; position: absolute; inset: auto 0 0; text-align: center;
  font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: #fff; background: rgba(20, 30, 25, 0.55); padding: 3px 0 5px;
  opacity: 0; transition: opacity 0.12s;
}
.avatar-upload:hover::after { opacity: 1; }
.profile-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.name-input {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 26px; font-weight: 700; letter-spacing: -0.015em;
  border: none; background: transparent; padding: 2px 6px; margin-left: -6px;
  border-radius: 8px; width: 100%;
}
.name-input:hover { background: var(--accent-soft-2); }
.name-input:focus { outline: none; background: var(--accent-soft-2); }
.context-input {
  border: none; background: transparent; color: var(--muted); font-size: 14px;
  padding: 2px 6px; margin-left: -6px; border-radius: 6px; width: 100%;
}
.context-input:hover { background: var(--accent-soft-2); }
.context-input:focus { outline: none; background: var(--accent-soft-2); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-add {
  border: 1px dashed var(--line); background: none; color: var(--faint);
  font-size: 12px; padding: 2px 9px; border-radius: 99px;
}
.chip-add:hover { color: var(--accent); border-color: var(--accent); }
.chip-input {
  border: 1px solid var(--accent); background: var(--card); font-size: 12px;
  padding: 2px 9px; border-radius: 99px; width: 110px;
}
.chip-input:focus { outline: none; }

.profile-actions { display: flex; gap: 8px; padding: 0 26px 22px; flex-wrap: wrap; }

.pcard { margin-top: 18px; padding: 20px 26px 22px; }
.pcard-title {
  font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 14px;
}
.pcard-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.pcard-title-row .pcard-title { margin: 0; }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
.field { display: flex; flex-direction: column; }
.field label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--faint); display: flex; align-items: center; gap: 6px;
}
.field label .icon-btn { width: 18px; height: 18px; opacity: 0; }
.field:hover label .icon-btn { opacity: 1; }
.field input {
  border: none; background: transparent; padding: 3px 6px; margin-left: -6px;
  border-radius: 6px; font-size: 14px;
}
.field input:hover { background: var(--accent-soft-2); }
.field input:focus { outline: none; background: var(--accent-soft-2); }
.add-field { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.cadence-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cadence-status { margin-top: 12px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.days-input { width: 64px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.days-input:focus { outline: none; border-color: var(--accent); }

.notes-area {
  width: 100%; min-height: 110px; resize: vertical; border: none;
  background: var(--card-2); border-radius: 12px; padding: 12px 14px;
  font-size: 14px; line-height: 1.6;
}
.notes-area:focus { outline: 1px solid var(--accent); }

/* timeline */
.tl-composer { display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line-soft); margin-bottom: 6px; }
.tl-entry { display: flex; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.tl-entry:last-child { border-bottom: none; }
.tl-icon {
  width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft-2); color: var(--accent);
}
.tl-body { flex: 1; min-width: 0; }
.tl-head { display: flex; align-items: baseline; gap: 8px; }
.tl-type { font-weight: 600; font-size: 13.5px; }
.tl-date { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tl-text { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; overflow-wrap: break-word; }
.tl-del { opacity: 0; }
.tl-entry:hover .tl-del { opacity: 1; }

/* reminders */
.rem-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.rem-date { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rem-text { flex: 1; font-size: 14px; }
.rem-add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.rem-add input[type="date"] { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.rem-add input[type="text"] { flex: 1; min-width: 140px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
.rem-add input:focus { outline: none; border-color: var(--accent); }

/* ---------- pro: star, bulk, history, merge ---------- */
.icon-btn.star.on { color: var(--soon); }
.icon-btn.star.on svg { fill: currentColor; }
.btn.star-on { color: var(--soon); border-color: var(--soon); }
.btn.star-on svg { fill: currentColor; }
.profile-archived {
  margin: -10px 26px 20px; padding: 8px 14px; border-radius: 10px;
  background: var(--line-soft); color: var(--muted); font-size: 13px;
}
.bulkbar {
  position: sticky; bottom: 16px; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 14px; margin-top: 16px; box-shadow: var(--shadow-lift);
}
.bulk-count { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.bulk-sep { width: 1px; height: 20px; background: var(--line); }
.bulk-input {
  width: 90px; border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; padding: 5px 9px; font-size: 13px;
}
.bulk-input:focus { outline: none; border-color: var(--accent); }
.row-check { width: 16px; height: 16px; accent-color: var(--accent); flex: 0 0 auto; cursor: pointer; }
.hist-type {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 8px;
  font-size: 12px; font-weight: 600; color: var(--accent);
}
.dup-group {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}
.dup-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
.dup-meta { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.field-act { display: inline-flex; color: var(--accent); }
.field-act:hover { color: var(--accent-hover); }

/* ---------- category colours ---------- */
.chip.gc-0 { background: var(--av0-bg); color: var(--av0-fg); }
.chip.gc-1 { background: var(--av1-bg); color: var(--av1-fg); }
.chip.gc-2 { background: var(--av2-bg); color: var(--av2-fg); }
.chip.gc-3 { background: var(--av3-bg); color: var(--av3-fg); }
.chip.gc-4 { background: var(--av4-bg); color: var(--av4-fg); }
.chip.gc-5 { background: var(--av5-bg); color: var(--av5-fg); }
.chip.gc-6 { background: var(--av6-bg); color: var(--av6-fg); }
.chip.gc-7 { background: var(--av7-bg); color: var(--av7-fg); }
button.chip.off { background: var(--line-soft); color: var(--faint); }
button.chip.off:hover { background: var(--accent-soft); color: var(--accent); }
button.chip.on { box-shadow: inset 0 0 0 1.5px currentColor; }

.swatch {
  width: 15px; height: 15px; border-radius: 50%; cursor: pointer;
  border: 1.5px solid transparent;
}
.swatch.gc-0 { background: var(--av0-fg); }
.swatch.gc-1 { background: var(--av1-fg); }
.swatch.gc-2 { background: var(--av2-fg); }
.swatch.gc-3 { background: var(--av3-fg); }
.swatch.gc-4 { background: var(--av4-fg); }
.swatch.gc-5 { background: var(--av5-fg); }
.swatch.gc-6 { background: var(--av6-fg); }
.swatch.gc-7 { background: var(--av7-fg); }
.swatch.on { border-color: var(--ink); }

/* ---------- relationship strength ---------- */
.strength { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.str-dot {
  width: 13px; height: 13px; border-radius: 50%; cursor: pointer;
  border: 1.5px solid var(--faint); background: transparent; padding: 0;
  transition: background 0.12s, border-color 0.12s;
}
.str-dot:hover { border-color: var(--accent); }
.str-dot.on { background: var(--accent); border-color: var(--accent); }
.str-label { font-size: 12px; color: var(--muted); margin-left: 6px; }
.str-mini { display: inline-flex; gap: 2px; align-items: center; }
.str-mini i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--line);
  display: block;
}
.str-mini i.on { background: var(--accent); }

/* ---------- multi-value fields ---------- */
.field.multi { gap: 2px; }
.multi-row { display: flex; align-items: center; gap: 6px; }
.multi-row input { flex: 1; min-width: 0; }
.custom-cadence {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted);
}
.custom-cadence .select { padding: 5px 6px; }

/* ---------- dashboard extras ---------- */
.uncat-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.uncat-note { margin: 0; font-size: 13px; color: var(--muted); }
.uncat-list { display: flex; flex-wrap: wrap; gap: 7px; }
.uncat-chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px 3px 3px;
  font-size: 13px; font-weight: 500; background: var(--card);
}
.uncat-chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- categories + rules modals ---------- */
.modal.wide { max-width: 660px; }
.cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.cat-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cat-name {
  border: none; font-size: 12.5px; font-weight: 600; padding: 4px 11px;
  border-radius: 99px; width: 130px; flex: 0 0 auto;
}
.cat-name:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.cat-count { font-size: 12px; color: var(--muted); flex: 1; min-width: 60px; font-variant-numeric: tabular-nums; }
.cat-swatches { display: inline-flex; gap: 4px; }

.rule-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; max-height: 340px; overflow-y: auto; }
.rule-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rule-word { font-size: 12px; color: var(--faint); }
.rule-input {
  flex: 1; min-width: 90px; border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; padding: 5px 9px; font-size: 13px;
}
.rule-input.short { flex: 0 0 110px; }
.rule-input:focus { outline: none; border-color: var(--accent); }
.rule-count {
  font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--line-soft);
  border-radius: 99px; padding: 2px 8px; font-variant-numeric: tabular-nums;
}

/* ---------- import review ---------- */
.li-steps { margin: 0 0 14px; padding-left: 20px; font-size: 13.5px; color: var(--muted); line-height: 1.7; }
.li-steps b { color: var(--ink); }
.li-modes { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
.li-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.li-check input { accent-color: var(--accent); }
.li-item.skipped { opacity: 0.45; }

/* ---------- insights ---------- */
.bar-row { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
.bar-label { flex: 0 0 130px; font-size: 13px; color: var(--muted); }
.bar-track { flex: 1; height: 9px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar-fill.gcf-0 { background: var(--av0-fg); }
.bar-fill.gcf-1 { background: var(--av1-fg); }
.bar-fill.gcf-2 { background: var(--av2-fg); }
.bar-fill.gcf-3 { background: var(--av3-fg); }
.bar-fill.gcf-4 { background: var(--av4-fg); }
.bar-fill.gcf-5 { background: var(--av5-fg); }
.bar-fill.gcf-6 { background: var(--av6-fg); }
.bar-fill.gcf-7 { background: var(--av7-fg); }
.bar-value {
  flex: 0 0 30px; text-align: right; font-size: 13px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.spark { display: flex; align-items: flex-end; gap: 6px; height: 92px; }
.spark-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.spark-bar { width: 100%; max-width: 26px; background: var(--accent-soft); border-top: 2px solid var(--accent); border-radius: 4px 4px 0 0; }
.spark-label { font-size: 10.5px; color: var(--faint); }
.stat-row { display: flex; gap: 26px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.stat span { font-size: 12px; color: var(--muted); }

/* ---------- quick capture ---------- */
.qc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 4px; }
.qc-field { display: flex; flex-direction: column; gap: 3px; }
.qc-field span {
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--faint);
}
.qc-field input {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  padding: 6px 9px; font-size: 13.5px;
}
.qc-field input:focus { outline: none; border-color: var(--accent); }

/* ---------- field-level merge ---------- */
.merge-grid {
  display: grid; grid-template-columns: 110px 1fr 1fr; gap: 6px;
  align-items: stretch; margin-bottom: 12px;
}
.merge-head {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600; padding-bottom: 4px;
}
.merge-key { font-size: 12px; color: var(--muted); align-self: center; }
.merge-key.same { opacity: 0.5; }
.merge-cell {
  display: flex; align-items: flex-start; gap: 7px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px;
  font-size: 13px; background: var(--card);
}
.merge-cell:hover { border-color: var(--accent); }
.merge-cell.on { border-color: var(--accent); background: var(--accent-soft-2); }
.merge-cell.same { opacity: 0.6; }
.merge-cell input { accent-color: var(--accent); margin-top: 2px; }
.merge-cell span { overflow-wrap: anywhere; }
.merge-note {
  font-size: 12.5px; color: var(--muted); background: var(--accent-soft-2);
  border-radius: 9px; padding: 8px 12px;
}

@media (max-width: 640px) {
  .qc-grid { grid-template-columns: 1fr; }
  .merge-grid { grid-template-columns: 1fr; }
  .merge-key { margin-top: 8px; font-weight: 600; }
}

/* ---------- cloud sync ---------- */
.rail-sync {
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card-2); display: flex; flex-direction: column; gap: 7px;
}
.rail-sync form { display: flex; flex-direction: column; gap: 7px; }
.sync-line { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; line-height: 1.4; }
.sync-line.ok { color: var(--accent); font-weight: 600; }
.sync-line.err { color: var(--overdue); }
.sync-line .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.sync-line .dot.wait { opacity: 0.4; }
.sync-pass {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  padding: 6px 9px; font-size: 13px; width: 100%;
}
.sync-pass:focus { outline: none; border-color: var(--accent); }
.push-line { flex-wrap: wrap; }
.push-line .push-on {
  color: var(--accent); font-weight: 600; font-size: 12px; text-align: left;
}
.push-line .push-on:hover { text-decoration: underline; }
.push-line .push-off {
  color: var(--faint); font-size: 11.5px; margin-left: 4px; text-decoration: underline;
}
.push-line .push-off:hover { color: var(--overdue); }
.momentum { color: var(--faint); font-size: 13px; }
.rail-tool.cap-alert {
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
  border-radius: 10px; padding: 8px 10px;
}
.rail-tool.cap-alert:hover { background: var(--accent); color: var(--accent-ink); }
.li-tip {
  font-size: 12.5px; color: var(--muted); background: var(--accent-soft-2);
  border-radius: 10px; padding: 9px 12px; margin: 0;
}

/* ---------- linkedin import ---------- */
.li-channel {
  border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}
.li-channel > b { font-size: 13.5px; }
.li-channel p { margin: 0; }
.li-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.li-actions a.btn { text-decoration: none; }
.li-paste {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  font-size: 12px; font-family: ui-monospace, monospace; background: var(--card-2); resize: vertical;
}
.li-paste:focus { outline: none; border-color: var(--accent); }
.li-options { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.li-review {
  display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto;
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 6px;
}
.li-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 9px;
  border-radius: 9px; cursor: pointer;
}
.li-item:hover { background: var(--accent-soft-2); }
.li-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li-who b { font-size: 13.5px; }
.li-who span {
  font-size: 12px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- toast & banner ---------- */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px;
  font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lift);
  animation: toast-in 0.18s ease-out; z-index: 50; max-width: 90vw;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.banner {
  background: var(--soon-soft); color: var(--soon); border: 1px solid var(--soon);
  border-radius: 12px; padding: 10px 16px; font-size: 13.5px; margin-bottom: 20px;
}

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(15, 22, 18, 0.4); z-index: 40;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lift);
  max-width: 480px; width: 100%; padding: 24px; max-height: 85vh; overflow: auto;
}
.modal h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; margin: 0 0 8px; font-size: 18px; }
.modal p { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
.modal textarea {
  width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; font-size: 12px; font-family: ui-monospace, monospace; background: var(--card-2);
  resize: vertical;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* ---------- responsive ---------- */
@media (max-width: 780px) {
  .app { flex-direction: column; }
  .rail {
    width: 100%; flex: none; height: auto; position: static;
    flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 14px 16px; border-right: none; border-bottom: 1px solid var(--line);
  }
  .nav { flex-direction: row; }
  .rail-spacer { display: none; }
  .rail-stats, .rail-hint { display: none; }
  .rail-tools { flex-direction: row; margin-left: auto; }
  .rail-tool span { display: none; }
  .page { padding: 24px 16px 80px; }
  .fields { grid-template-columns: 1fr; }
  .profile-head { flex-direction: column; align-items: center; text-align: center; }
  .profile-id { width: 100%; align-items: center; }
  .name-input, .context-input { text-align: center; }
  .chip-row { justify-content: center; }
  .profile-actions { justify-content: center; }
  .quicklog { padding-left: 18px; }
  .person-side .btn span.lbl { display: none; }
}

/* ---------- integrations & AI ---------- */
.dot-ok {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  margin-left: auto; flex: 0 0 auto;
}
.int-block {
  border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  margin-bottom: 12px; display: flex; flex-direction: column; gap: 9px;
}
.int-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.int-head b { font-size: 13.5px; }
.int-state {
  font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
}
.int-state.on { background: var(--accent-soft); color: var(--accent); }
.int-state.off { background: var(--line-soft); color: var(--muted); }
.int-toggles { display: flex; gap: 14px; flex-wrap: wrap; }
.int-block code {
  font-family: ui-monospace, monospace; font-size: 11.5px;
  background: var(--card-2); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere;
}

.sync-strip {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 14px; margin-bottom: 20px; font-size: 13px; color: var(--muted);
}
.sync-strip .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.sync-strip .dot.ok { background: var(--accent); }
.sync-strip .dot.off { background: var(--faint); }
.sync-strip .btn { margin-left: auto; }

.ai-note { font-size: 11.5px; color: var(--faint); }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.ai-err {
  font-size: 12.5px; color: var(--overdue); background: var(--overdue-soft);
  border-radius: 9px; padding: 8px 12px; margin: 0 0 10px;
}
.ai-out {
  background: var(--card-2); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 10px; display: flex; flex-direction: column; gap: 9px; align-items: flex-start;
}
.ai-out-body { font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: break-word; }
.ai-draft { margin-top: 4px; }
.ai-draft-text {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font: inherit; font-size: 13.5px; line-height: 1.6; background: var(--card); resize: vertical;
}
.ai-draft-text:focus { outline: none; border-color: var(--accent); }

.ask-bar {
  display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
  background: var(--card); border: 1px solid var(--accent); border-radius: 12px;
  padding: 8px 12px; color: var(--accent);
}
.ask-bar input { flex: 1; min-width: 0; border: none; background: none; color: var(--ink); }
.ask-bar input:focus { outline: none; }
.ask-result {
  font-size: 13px; color: var(--muted); background: var(--accent-soft-2);
  border-radius: 10px; padding: 8px 13px; margin-bottom: 12px;
}

/* ---------- onboarding / empty home ---------- */
.start-card { padding: 26px; margin-bottom: 18px; }
.start-title {
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-size: 17px; font-weight: 700; margin: 0 0 16px;
}
.start-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.start-tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  text-align: left; background: var(--card); transition: border-color 0.12s, transform 0.12s;
}
.start-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.start-tile svg { color: var(--accent); }
.start-tile b { font-size: 14.5px; }
.start-tile span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.start-foot {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft);
  font-size: 13px; color: var(--muted);
}
.start-how { padding: 20px 26px 22px; }
.start-how .li-steps { margin-bottom: 0; }

.checklist {
  padding: 14px 18px 12px; margin-bottom: 20px;
  display: flex; flex-direction: column; gap: 2px;
}
.checklist-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 8px; font-size: 13.5px;
}
.checklist-head span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.check-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 4px;
  font-size: 13.5px; color: var(--ink); text-align: left; border-radius: 8px;
}
.check-row:not(.done):hover { background: var(--accent-soft-2); color: var(--accent); }
.check-row.done { color: var(--faint); cursor: default; }
.check-box {
  width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex: 0 0 auto;
}
.check-row.done .check-box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- network view ---------- */
.page.wide { max-width: 1180px; }
.tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.tab {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 99px; font-size: 13.5px; font-weight: 500;
  color: var(--muted); border: 1px solid var(--line); background: var(--card);
}
.tab:hover { border-color: var(--accent); color: var(--accent); }
.tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.net-split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.map-wrap {
  position: relative; border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden; background: var(--card); box-shadow: var(--shadow);
}
.map { display: block; width: 100%; height: auto; }
.map-sea { fill: var(--map-sea); }
.map-land { fill: var(--map-land); stroke: var(--map-line); stroke-width: 0.5; }
.map-pin { cursor: pointer; }
.map-halo { fill: var(--accent); opacity: 0.18; }
.map-pin:hover .map-halo, .map-pin.on .map-halo { opacity: 0.25; }
.map-bubble { fill: var(--accent); stroke: var(--card); stroke-width: 0.8; }
.map-pin.on .map-bubble { fill: var(--ink); }
.map-count {
  fill: var(--accent-ink); text-anchor: middle; font-weight: 700;
  font-family: "Bricolage Grotesque", system-ui, sans-serif; pointer-events: none;
}
.map-pin.on .map-count { fill: var(--bg); }
.map-zoom {
  position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px;
}
.map-foot {
  padding: 9px 14px; font-size: 12.5px; color: var(--muted);
  border-top: 1px solid var(--line-soft); background: var(--card-2);
}
.net-side { padding: 14px; position: sticky; top: 20px; }
.net-side-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 8px; font-size: 13.5px;
}
.net-list { display: flex; flex-direction: column; gap: 1px; max-height: 460px; overflow-y: auto; }
.net-item {
  display: flex; align-items: center; gap: 9px; padding: 6px 8px;
  border-radius: 9px; text-align: left; width: 100%;
}
.net-item:hover { background: var(--accent-soft-2); }
.net-item-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.net-item-sub {
  font-size: 12px; color: var(--muted); margin-left: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
}

.tree { display: flex; flex-direction: column; gap: 4px; }
.tree-branch { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
.tree-node { display: flex; align-items: center; gap: 10px; padding: 11px 14px; width: 100%; text-align: left; }
.tree-node:hover { background: var(--accent-soft-2); }
.tree-caret { color: var(--faint); transition: transform 0.12s; display: inline-block; }
.tree-caret.open { transform: rotate(90deg); }
.tree-count {
  margin-left: auto; font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; background: var(--line-soft);
  border-radius: 99px; padding: 1px 9px;
}
.tree-kids { padding: 4px 14px 12px 34px; display: flex; flex-direction: column; gap: 1px; }
.tree-leaf { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 8px; text-align: left; }
.tree-leaf:hover { background: var(--accent-soft-2); }
.tree-leaf-name { font-size: 13.5px; font-weight: 500; }
.tree-leaf-sub { font-size: 12px; color: var(--muted); margin-left: auto; }
.tree-empty { font-size: 12.5px; color: var(--faint); padding: 4px 8px; }

.rel-row { display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; }
.rel-source { display: flex; align-items: center; gap: 11px; text-align: left; }
.rel-source b { font-size: 14px; display: block; }
.rel-sub { font-size: 12.5px; color: var(--muted); }
.rel-kids { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 49px; }

@media (max-width: 900px) {
  .net-split { grid-template-columns: 1fr; }
  .net-side { position: static; }
}
.map-grat line { stroke: var(--map-line); stroke-width: 0.4; opacity: 0.5; }
